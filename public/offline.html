<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1E2A5A"><title>Offline — Plated</title>
<link rel="icon" href="/favicon.png" type="image/png">
<style>
  :root { color-scheme: light dark; }
  body { margin:0; min-height:100dvh; display:flex; align-items:center; background:#F6F5F1; color:#1E2A5A;
    font-family: Figtree, ui-sans-serif, system-ui, -apple-system, sans-serif; }
  main { padding: 0 28px; max-width: 520px; }
  .mark { font-family: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif; font-size: 22px; letter-spacing:-.01em; }
  .mark span { color:#F2A900; }
  h1 { font-family: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif; font-weight: 700; font-size: clamp(44px, 12vw, 72px); line-height: .95; margin: 56px 0 16px; letter-spacing: -.02em; }
  p { color:#6f675c; font-size: 16px; line-height: 1.5; margin: 0; }
  hr { border:0; border-top:1px solid rgba(28,26,23,.1); margin: 32px 0; }
  button { font: inherit; font-size: 14px; background:#1E2A5A; color:#F6F5F1; border:0; border-radius: 8px; height: 44px; padding: 0 20px; cursor:pointer; }
  @media (prefers-color-scheme: dark) { body { background:#1f1c19; color:#f3eee6; } p { color:#a89f92; } hr { border-top-color: rgba(243,238,230,.12);} button { background:#f3eee6; color:#1f1c19; } }
</style>
</head>
<body>
<main>
  <div class="mark">Plated<span>.</span></div>
  <h1>No signal. The kitchen's still here.</h1>
  <p>You're offline right now. Check your connection and we'll pick up where you left off.</p>
  <hr>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
